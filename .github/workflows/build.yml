name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 선택: 서명키를 Secrets에 넣어두면 매 빌드가 같은 키로 서명돼서 '업데이트 설치'가 됨
      - name: Decode signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk sms-forwarder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-apk
          path: sms-forwarder.apk

      # main 브랜치면 Releases에 올려서 폰 브라우저로 바로 받을 수 있게
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 문자전달 v1.0.${{ github.run_number }}
          files: sms-forwarder.apk
