<title>쌀먹 회선 매니저</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 상단 바 + 탭(홈·캘린더·추가·이벤트), 모바일은 하단 탭. 고지서·통장 앱처럼 숫자 중심, 청록 포인트 */
:root {
  --bg: #eef2f4; --panel: #ffffff; --panel-2: #f6f8f9; --ink: #13202a; --ink-2: #455561; --muted: #7d8b95;
  --line: #d9e1e6; --grid: #e7ecef; --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #d9f0ec;
  --pos: #18794e; --neg: #c03a2b; --warn: #a15c00; --warn-soft: #fff1d6; --neg-soft: #fde8e4;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #b07d00; --s5: #e87ba4; --s6: #6250d6;
  --gift: #2a78d6; --fee: #eb6834; --cum: #13202a;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1518; --panel: #172025; --panel-2: #1c272d; --ink: #e9f0f3; --ink-2: #b4c2ca; --muted: #85949d;
  --line: #2a363d; --grid: #222d33; --accent: #3fb8a9; --accent-ink: #062320; --accent-soft: #163a36;
  --pos: #4cc08a; --neg: #f07b68; --warn: #f0b44c; --warn-soft: #3a2e14; --neg-soft: #3d1f1a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9;
  --gift: #3987e5; --fee: #d95926; --cum: #e9f0f3; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1518; --panel: #172025; --panel-2: #1c272d; --ink: #e9f0f3; --ink-2: #b4c2ca; --muted: #85949d;
  --line: #2a363d; --grid: #222d33; --accent: #3fb8a9; --accent-ink: #062320; --accent-soft: #163a36;
  --pos: #4cc08a; --neg: #f07b68; --warn: #f0b44c; --warn-soft: #3a2e14; --neg-soft: #3d1f1a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9;
  --gift: #3987e5; --fee: #d95926; --cum: #e9f0f3; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .mut { color: var(--muted); }

/* 상단 바 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: .72rem; font-weight: 700; }
.tabs { display: flex; gap: 4px; margin-left: 12px; }
.tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; color: var(--ink-2); cursor: pointer; font-weight: 500; }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.tab:focus-visible, .btn:focus-visible, .chip-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; font-size: .8rem; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.sync { font-size: .75rem; color: var(--muted); }

main { max-width: 1120px; margin: 0 auto; padding-block: 18px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { display: grid; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font-size: .98rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel h2 .aside { margin-left: auto; font-weight: 400; font-size: .8rem; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.kpi .k { font-size: .76rem; color: var(--muted); }
.kpi .v { font: 600 1.4rem var(--mono); font-variant-numeric: tabular-nums; margin-top: 2px; letter-spacing: -0.02em; }
.kpi .h { font-size: .76rem; color: var(--ink-2); margin-top: 2px; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--neg); border-color: var(--neg); }
.btn.sm { padding: 4px 10px; font-size: .8rem; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--ink-2); white-space: nowrap; }
.chip.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.chip.bad { border-color: var(--neg); color: var(--neg); background: var(--neg-soft); }
.chip.ok { border-color: var(--pos); color: var(--pos); }
.chip.acc { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

/* 회선 카드 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.lc { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; text-align: left; display: grid; gap: 8px; min-width: 0; }
.lc:hover { border-color: var(--accent); }
.lc .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.lc .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc .pl { font-size: .8rem; color: var(--ink-2); overflow-wrap: anywhere; }
.lc .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .82rem; }
.bar { height: 6px; background: var(--grid); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.lc.add { place-items: center; color: var(--muted); border-style: dashed; min-height: 140px; font-weight: 500; }

/* 일정 목록 */
.agenda { display: grid; gap: 2px; }
.ag { display: grid; grid-template-columns: 76px 12px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 4px; border-radius: 8px; font-size: .86rem; }
.ag:hover { background: var(--panel-2); }
.ag .d { font-family: var(--mono); font-size: .8rem; color: var(--ink-2); }
.ag .d b { color: var(--ink); font-weight: 600; }
.ag .t { min-width: 0; overflow-wrap: anywhere; }
.ag .t small { color: var(--muted); display: block; font-size: .75rem; }
.ag.done .t { color: var(--muted); text-decoration: line-through; }
.ag.late { background: var(--neg-soft); }
.chk { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.empty { color: var(--muted); font-size: .88rem; padding: 18px 4px; text-align: center; }

/* 차트 */
.scroll { overflow-x: auto; }
svg text { fill: var(--ink-2); font: 11px var(--sans); }
svg .axis { stroke: var(--line); } svg .gridl { stroke: var(--grid); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.ln { height: 2px; width: 14px; vertical-align: 3px; }
.tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .8rem; box-shadow: 0 6px 20px rgba(0,0,0,.18); z-index: 40; max-width: 280px; }
.tip .r { display: flex; justify-content: space-between; gap: 16px; }

/* 표 */
table { border-collapse: collapse; width: 100%; font-size: .83rem; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: .74rem; white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.cur td { background: var(--accent-soft); }
.gl { display: grid; gap: 3px; }
.gl label { display: flex; gap: 6px; align-items: center; font-size: .8rem; cursor: pointer; }
.gl label.done span { color: var(--muted); text-decoration: line-through; }

/* 폼 */
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: .78rem; color: var(--muted); font-weight: 500; }
.in { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 9px 11px; min-width: 0; }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.paste { display: flex; gap: 8px; }
.paste .in { flex: 1; }
.plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.pc { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; text-align: left; background: var(--panel); }
.pc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.pc b { font-weight: 600; font-size: .86rem; } .pc .num { font-size: .82rem; color: var(--ink-2); }
.holds { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.hc { border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; cursor: pointer; background: var(--panel); display: grid; gap: 1px; text-align: left; position: relative; }
.hc[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.hc b { font-size: .8rem; } .hc .num { font-size: .78rem; }
.hc .tag { position: absolute; top: -8px; right: 6px; font-size: .62rem; background: var(--accent); color: var(--accent-ink); padding: 0 5px; border-radius: 4px; }
.notes { display: grid; gap: 4px; font-size: .84rem; }
.notes li { margin-left: 18px; }
.callout { border-radius: 10px; padding: 10px 12px; font-size: .84rem; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.callout.info { background: var(--panel-2); border-color: var(--line); }
.callout b { color: var(--warn); }
.summary-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.summary-strip > div { background: var(--panel-2); border-radius: 9px; padding: 8px 10px; }
.summary-strip .k { font-size: .72rem; color: var(--muted); } .summary-strip .v { font: 600 1.02rem var(--mono); }
.gift-rows { display: grid; gap: 6px; }
.gift-row { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)) auto; gap: 6px; align-items: end; }

/* 이벤트 목록 */
.evs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.ev { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.ev.ended { opacity: .62; }
.ev .tt { font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
.ev .row { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--ink-2); flex-wrap: wrap; }

/* 캘린더 */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-head h2 { margin: 0; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: .72rem; color: var(--muted); text-align: center; padding: 2px 0; }
.cell { min-height: 74px; background: var(--panel-2); border-radius: 8px; padding: 5px 6px; display: grid; align-content: start; gap: 3px; cursor: pointer; border: 1px solid transparent; text-align: left; min-width: 0; }
.cell.out { opacity: .4; }
.cell.today { border-color: var(--accent); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cell .dn { font-size: .76rem; font-family: var(--mono); color: var(--ink-2); }
.cell .evl { font-size: .68rem; border-radius: 4px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); background: var(--panel); border-left: 3px solid var(--c); }
.cell .sum { font-size: .66rem; font-family: var(--mono); color: var(--pos); }

/* 상세 시트 */
.sheet-bg { position: fixed; inset: 0; background: rgba(5, 12, 16, .45); z-index: 30; display: flex; justify-content: flex-end; }
.sheet { width: min(760px, 100%); height: 100%; overflow-y: auto; background: var(--bg); padding-block: calc(env(safe-area-inset-top, 0px) + 16px) 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }
.sheet-top { display: flex; align-items: center; gap: 10px; }
.sheet-top h2 { margin: 0; font-size: 1.1rem; }
.x { margin-left: auto; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 9px; font-size: .85rem; z-index: 50; }
.foot { font-size: .76rem; color: var(--muted); }

/* 모바일 */
.bnav { display: none; }
@media (max-width: 760px) {
  .tabs { display: none; }
  .bnav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .bnav button { border: 0; background: transparent; padding: 10px 0 8px; font-size: .76rem; color: var(--muted); display: grid; justify-items: center; gap: 2px; cursor: pointer; }
  .bnav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .bnav svg { width: 20px; height: 20px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .summary-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ag { grid-template-columns: 44px 10px minmax(0, 1fr) auto auto; gap: 7px; }
  .ag .d { white-space: nowrap; font-size: .74rem; } .ag .d b + * { display: none; }
  .cell { min-height: 54px; padding: 4px; }
  .cell .evl { font-size: 0; padding: 0; height: 5px; border-left-width: 0; background: var(--c); }
  .gift-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="top">
  <div class="top-in">
    <div class="brand"><span class="mark">쌀</span>쌀먹 회선 매니저</div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="home">홈</button>
      <button class="tab" data-view="cal">캘린더</button>
      <button class="tab" data-view="add">회선 추가</button>
      <button class="tab" data-view="events">이벤트</button>
    </nav>
    <div class="top-right">
      <span class="sync" id="sync"></span>
      <div class="seg" role="group" aria-label="사은품 범위">
        <button id="m-all" aria-pressed="true">적립금 포함</button>
        <button id="m-cash" aria-pressed="false">현금만</button>
      </div>
    </div>
  </div>
</div>

<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-cal" hidden></section>
  <section class="view" id="v-add" hidden></section>
  <section class="view" id="v-events" hidden></section>
</main>

<nav class="bnav" id="bnav">
  <button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button data-view="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>캘린더</button>
  <button data-view="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>추가</button>
  <button data-view="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>이벤트</button>
</nav>
<div class="tip" id="tip" hidden></div>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================== 유틸 ============================== */
const $ = s => document.querySelector(s);
const fmt = n => Number(n || 0).toLocaleString("ko-KR");
const sgn = n => (n > 0 ? "+" : "") + fmt(n);
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SER = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];
const pad = n => String(n).padStart(2, "0");
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const P = s => { const [y, m, d] = s.split("-").map(Number); return { y, m, d }; };
const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const addM = (y, m, n) => { const t = y * 12 + (m - 1) + n; return { y: Math.floor(t / 12), m: (t % 12) + 1 }; };
const mDiff = (a, b) => (b.y - a.y) * 12 + (b.m - a.m);
const toUTC = s => { const p = P(s); return Date.UTC(p.y, p.m - 1, p.d); };
const addDays = (s, n) => { const d = new Date(toUTC(s) + n * 86400000); return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); };
const dayDiff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 86400000);
const nowLocal = () => { const d = new Date(); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const TODAY = nowLocal();
const md = s => s ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : "";
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const wd = s => WD[new Date(toUTC(s)).getUTCDay()];
const URL_RE = /^https?:\/\/(?:www\.)?ssalmuk\.life\/events\/([^\/?#]+)\/([^\/?#]+)\/(\d{4}-\d{2}-\d{2})/;
const eventIdFromUrl = u => { const m = String(u || "").trim().match(URL_RE); return m ? `${m[1]}_${m[2]}_${m[3]}`.replace(/[^A-Za-z0-9_\-.~:@+]/g, "_") : null; };
const NON_CASH = ["라이프케어"];
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; const w = tip.offsetWidth, h = tip.offsetHeight;

/* ============================== 계산 엔진 ============================== */
/* 사이트 규칙: 가입월·해지월 일할, 해지일 기본 = 마지막 달 마지막 지급일(보통 23일), 해지월 지급분은 지급일 ≤ 해지일 */
function catalogOf(snap, label) { return (snap.catalog || []).find(c => c.l === label); }
function giftKind(snap, label) { return catalogOf(snap, label)?.kind || ""; }

function resolveHold(plan, join, opt) {
  const j = P(join);
  if (opt.cancel) { const c = P(opt.cancel); return { hold: mDiff(j, c) + 1, cancel: opt.cancel }; }
  const hold = Math.max(1, Math.min(+opt.hold || 1, plan.m.length));
  const last = addM(j.y, j.m, hold - 1);
  const cd = (plan.cd || {})[String(hold)] || 23;
  return { hold, cancel: ymd(last.y, last.m, Math.min(cd, dim(last.y, last.m))) };
}

function compute(line, cashOnly) {
  const snap = line.snap, plan = snap.plan;
  const { hold, cancel } = resolveHold(plan, line.join, { hold: line.hold, cancel: line.cancel });
  const j = P(line.join), c = P(cancel);
  const rows = [];
  for (let k = 0; k < Math.min(hold, plan.m.length); k++) {
    const [baseFee, gifts] = plan.m[k];
    const ms = addM(j.y, j.m, k), dm = dim(ms.y, ms.m);
    const start = k === 0 ? j.d : 1, end = k === hold - 1 ? c.d : dm;
    const fee = Math.round(baseFee * Math.max(0, end - start + 1) / dm);
    const gs = [];
    for (const [label, amount, pday] of gifts) {
      if (isExcluded(line, label)) continue;
      const kind = giftKind(snap, label);
      if (cashOnly && NON_CASH.some(x => kind.includes(x))) continue;
      if (k === hold - 1 && pday && pday > c.d) continue;
      const date = pday ? ymd(ms.y, ms.m, Math.min(pday, dm)) : fixedDate(snap, label);
      gs.push({ label, amount, date, kind, key: `${ymd(ms.y, ms.m, 1).slice(0, 7)}|${label}` });
    }
    for (const ig of plan.ig || []) {
      if (isExcluded(line, ig.label)) continue;
      for (let n = 0; ; n++) {
        if (ig.times && n >= ig.times) break;
        const d = addDays(line.join, ig.first_after_days + n * ig.every_days);
        if (d > cancel) break;
        const p = P(d); if (p.y === ms.y && p.m === ms.m) gs.push({ label: ig.label, amount: ig.amount, date: d, kind: ig.kind || "", key: `${d}|${ig.label}` });
      }
    }
    gs.sort((a, b) => (a.date || "9").localeCompare(b.date || "9"));
    const gift = gs.reduce((a, g) => a + g.amount, 0);
    rows.push({ k, label: k ? `M+${k}` : "M", month: `${ms.y}-${pad(ms.m)}`, fee, gift, gifts: gs });
  }
  const fee_total = rows.reduce((a, r) => a + r.fee, 0), gift_total = rows.reduce((a, r) => a + r.gift, 0);
  const recv = line.recv || {};
  let received = 0, overdue = 0, paid = 0;
  rows.forEach(r => { if (r.month <= TODAY.slice(0, 7)) paid += r.fee;
    r.gifts.forEach(g => { if (recv[g.key]) received += g.amount; else if (g.date && g.date < TODAY) overdue += g.amount; }); });
  return { hold, cancel, rows, fee_total, gift_total, profit: gift_total - fee_total, monthly: Math.round((gift_total - fee_total) / hold), received, overdue, paid };
}

/* 유지기간별 순이익 (추가 화면 미리보기) */
function holdTable(snap, join, excl, cashOnly) {
  const out = [];
  for (let h = 1; h <= Math.min(18, snap.plan.m.length); h++) {
    const r = compute({ snap, join, hold: h, excl }, cashOnly);
    out.push({ h, profit: r.profit, monthly: r.monthly, cancel: r.cancel });
  }
  const bestT = out.reduce((a, b) => b.profit > a.profit ? b : a, out[0]);
  const bestM = out.reduce((a, b) => b.monthly > a.monthly ? b : a, out[0]);
  return { out, bestT: bestT?.h, bestM: bestM?.h };
}

    hit.addEventListener("mousemove", e => { const cx = L + band * (i + .5); cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", 1);
      showTip(e, `<b>${p.m}</b><div class="r"><span>사은품</span><span class="num">${fmt(p.gift)}</span></div><div class="r"><span>요금</span><span class="num">${fmt(p.fee)}</span></div><div class="r"><span>월 손익</span><span class="num">${sgn(p.gift - p.fee)}</span></div><div class="r"><span>누적</span><span class="num">${sgn(p.cum)}</span></div>` + p.items.map(([n, v]) => `<div class="r mut"><span>${esc(n)}</span><span class="num">${sgn(v)}</span></div>`).join("")); });

function bindReady(A) {
  const v = $("#v-add");
  v.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { A.plan = b.dataset.plan; A.hold = holdTable(snapOf(A.ev, A.plan), A.join, A.excl, cashOnly()).bestT; renderAdd(); });
  v.querySelectorAll("[data-hold]").forEach(b => b.onclick = () => { if (b.dataset.hold === "custom") { A.custom = true; } else { A.custom = false; A.hold = +b.dataset.hold; } renderAdd(); });
  $("#f-join").onchange = e => { if (e.target.value) { A.join = e.target.value; renderAdd(); } };
  $("#f-name").oninput = e => { A.name = e.target.value; };
  const fc = $("#f-cancel"); if (fc) fc.onchange = e => { A.cancel = e.target.value; renderAdd(); };
  v.querySelectorAll("[data-excl]").forEach(b => b.onchange = () => { const l = b.dataset.excl; A.excl = b.checked ? A.excl.filter(x => x !== l) : [...A.excl, l]; renderAdd(); });
  const cr = $("#copy-ref"); if (cr) cr.onclick = () => copy(A.ev.referrer);
  $("#f-save").onclick = async () => {
    const snap = snapOf(A.ev, A.plan);
    const doc = { name: A.name.trim() || `${A.ev.carrierName} ${A.plan}`, snap, join: A.join, excl: A.excl, memo: "", recv: {}, checks: {}, todos: [], created: new Date().toISOString() };
    if (A.custom) doc.cancel = A.cancel; else doc.hold = A.hold;
    await addLine(doc);
  };
}
function copy(text) { const done = () => toast("복사했어: " + text);
  try { navigator.clipboard.writeText(text).then(done, () => toast("복사 안 됨: " + text)); } catch (e) { toast(text); } }

/* 직접 입력 */
function defaultManual() { return { carrier: "", plan: "", fee: 5000, promoMonths: 7, after: 0, join: TODAY, name: "", cancel: "", hold: 7,
  gifts: [{ l: "네이버페이", amount: 0, start: 2, count: 6, day: 23, kind: "네이버페이" }], ig: { on: false, amount: 5000, first: 30, every: 30 } }; }
function manualSnap(f) {
  const N = 25, m = [];
  for (let k = 0; k < N; k++) {
    const gs = []; f.gifts.forEach(g => { if (g.l && g.amount > 0 && k >= g.start && k < g.start + g.count) gs.push([g.l, +g.amount, +g.day || null]); });
    m.push([k < f.promoMonths ? +f.fee : (+f.after || +f.fee), gs]);
  }
  const ig = f.ig.on ? [{ label: "30일 주기 지급", amount: +f.ig.amount, first_after_days: +f.ig.first, every_days: +f.ig.every, kind: "네이버페이" }] : [];
  return { eventId: "manual", url: /^https:\/\//.test(f.url || "") ? f.url : "", title: `${f.carrier} ${f.plan}`.trim(), carrier: "manual", carrierName: f.carrier || "직접 입력", period: null,
    conditions: [], warnings: [], payNotes: [], cautions: [], catalog: f.gifts.map(g => ({ l: g.l, kind: g.kind, payout: `M+${g.start}부터 ${g.count}회` })),
    plan: { name: f.plan || "요금제", fee: +f.fee, cd: {}, m, ig }, snapAt: new Date().toISOString() };
}
function manualForm(A) {
  const f = A.mf ||= defaultManual(); f.url = A.url;
  let r = null; try { r = compute({ snap: manualSnap(f), join: f.join, hold: f.cancel ? null : f.hold, cancel: f.cancel || null, excl: [] }, false); } catch (e) {}
  const inp = (k, label, type = "text", val = f[k]) => `<label class="field"><span>${label}</span><input class="in" data-mf="${k}" type="${type}" value="${esc(val)}"></label>`;
  return `<div class="panel"><h2>직접 입력</h2>
    <div class="form-row">${inp("carrier", "통신사")}${inp("plan", "요금제 이름")}${inp("name", "회선 이름")}</div>
    <div class="form-row" style="margin-top:10px">${inp("fee", "할인 요금 (월)", "number")}${inp("promoMonths", "할인 개월 (개통월 포함)", "number")}${inp("after", "할인 후 요금", "number")}</div>
    <div class="form-row" style="margin-top:10px">${inp("join", "개통일", "date")}${inp("hold", "유지 개월", "number")}${inp("cancel", "또는 해지일", "date")}</div>
    <h2 style="margin-top:16px">매월 사은품 <span class="aside">시작 M+k = 개통월 기준 k개월 뒤</span></h2>
    <div class="gift-rows">${f.gifts.map((g, i) => `<div class="gift-row">
      <label class="field"><span>이름</span><input class="in" data-g="${i}" data-k="l" value="${esc(g.l)}"></label>
      <label class="field"><span>금액</span><input class="in" type="number" data-g="${i}" data-k="amount" value="${g.amount}"></label>
      <label class="field"><span>시작 M+</span><input class="in" type="number" data-g="${i}" data-k="start" value="${g.start}"></label>
      <label class="field"><span>횟수</span><input class="in" type="number" data-g="${i}" data-k="count" value="${g.count}"></label>
      <label class="field"><span>지급일</span><input class="in" type="number" data-g="${i}" data-k="day" value="${g.day}"></label>
      <button class="btn sm" data-gdel="${i}" aria-label="삭제">삭제</button></div>`).join("")}</div>
    <button class="btn sm" id="g-add" style="margin-top:8px">사은품 줄 추가</button>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.86rem"><input type="checkbox" class="chk" id="ig-on" ${f.ig.on ? "checked" : ""}>개통 후 30일 주기 지급 (예: 쉐이크모바일 Npay)</label>
    ${f.ig.on ? `<div class="form-row" style="margin-top:8px"><label class="field"><span>금액</span><input class="in" type="number" data-ig="amount" value="${f.ig.amount}"></label><label class="field"><span>첫 지급 (개통 후 일수)</span><input class="in" type="number" data-ig="first" value="${f.ig.first}"></label><label class="field"><span>주기 (일)</span><input class="in" type="number" data-ig="every" value="${f.ig.every}"></label></div>` : ""}
    ${r ? `<div class="summary-strip" style="margin-top:14px"><div><div class="k">총요금</div><div class="v">${fmt(r.fee_total)}</div></div><div><div class="k">총사은품</div><div class="v">${fmt(r.gift_total)}</div></div><div><div class="k">순이익</div><div class="v ${cls(r.profit)}">${sgn(r.profit)}</div></div><div><div class="k">해지일</div><div class="v">${md(r.cancel)}</div></div></div>` : ""}
    <div style="margin-top:12px"><button class="btn primary" id="mf-save" ${r && !S.readOnly ? "" : "disabled"}>회선 저장</button></div></div>`;
}
function bindManual(A) {
  const v = $("#v-add"), f = A.mf;
  const re = () => { const a = document.activeElement?.dataset; renderAdd(); if (a) { const sel = a.mf ? `[data-mf="${a.mf}"]` : a.g !== undefined ? `[data-g="${a.g}"][data-k="${a.k}"]` : a.ig ? `[data-ig="${a.ig}"]` : null; const n = sel && v.querySelector(sel); if (n) n.focus(); } };
  v.querySelectorAll("[data-mf]").forEach(i => i.onchange = () => { f[i.dataset.mf] = i.type === "number" ? +i.value : i.value; re(); });
  v.querySelectorAll("[data-g]").forEach(i => i.onchange = () => { const g = f.gifts[+i.dataset.g]; g[i.dataset.k] = i.type === "number" ? +i.value : i.value; if (i.dataset.k === "l") g.kind = /적립|포인트|쿠폰/.test(i.value) ? "적립금" : "네이버페이"; re(); });
  v.querySelectorAll("[data-gdel]").forEach(b => b.onclick = () => { f.gifts.splice(+b.dataset.gdel, 1); re(); });
  v.querySelectorAll("[data-ig]").forEach(i => i.onchange = () => { f.ig[i.dataset.ig] = +i.value; re(); });
  $("#g-add").onclick = () => { f.gifts.push({ l: "", amount: 0, start: 1, count: 1, day: 23, kind: "네이버페이" }); re(); };
  $("#ig-on").onchange = e => { f.ig.on = e.target.checked; re(); };
  $("#mf-save").onclick = async () => {
    const doc = { name: f.name || `${f.carrier} ${f.plan}`.trim() || "새 회선", snap: manualSnap(f), join: f.join, excl: [], memo: "", recv: {}, checks: {}, todos: [], created: new Date().toISOString() };
    if (f.cancel) doc.cancel = f.cancel; else doc.hold = +f.hold;
    await addLine(doc);
  };
}

/* ============================== 저장 ============================== */
async function addLine(doc) {
  if (!S.db) return toast("저장소에 연결 안 됨");
  try { const ref = S.db.collection("lines").doc(); await ref.set(doc); toast("회선 저장함"); S.add = null; go("home"); setTimeout(() => openSheet(ref.id), 50); }
  catch (e) { toast(e?.code === "quota_exceeded" ? "저장 공간이 가득 찼어" : "저장 실패: " + (e?.message || e?.code || "")); }
}
const saving = {};
async function saveLine(id, patch, msg) {
  if (!S.db || S.readOnly) return toast("보기 전용이야");
  const run = async () => { try { await S.db.doc("lines/" + id).update(patch); if (msg) toast(msg); } catch (e) { toast("저장 실패: " + (e?.message || e?.code || "")); } };
  saving[id] = (saving[id] || Promise.resolve()).then(run); return saving[id];
}

/* ============================== 회선 상세 시트 ============================== */
function openSheet(id) { S.sheet = { id, edit: false, del: false }; renderSheet(); }
function closeSheet() { S.sheet = null; $("#sheet-root").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });
function monthTable(r, line) {
  const recv = line?.recv || {};
  return `<table><thead><tr><th>회차</th><th>월</th><th class="n">요금</th><th class="n">사은품</th><th class="n">손익</th><th>지급 내역</th></tr></thead><tbody>
    ${r.rows.map(x => `<tr class="${x.month === TODAY.slice(0, 7) ? "cur" : ""}"><td>${x.label}</td><td class="num">${x.month.slice(2).replace("-", ".")}</td><td class="n">${fmt(x.fee)}</td><td class="n">${fmt(x.gift)}</td><td class="n ${cls(x.gift - x.fee)}">${sgn(x.gift - x.fee)}</td>
      <td><div class="gl">${x.gifts.map(g => line ? `<label class="${recv[g.key] ? "done" : ""}"><input type="checkbox" class="chk" data-act="gift" data-line="${esc(line.id)}" data-key="${esc(g.key)}" ${recv[g.key] ? "checked" : ""} ${S.readOnly ? "disabled" : ""}><span>${esc(g.label)} <span class="num">${fmt(g.amount)}</span> <span class="mut">${g.date ? md(g.date) : "날짜 공지"}</span></span></label>` : `<span style="font-size:.8rem">${esc(g.label)} <span class="num">${fmt(g.amount)}</span> <span class="mut">${g.date ? md(g.date) : ""}</span></span>`).join("") || '<span class="mut">—</span>'}</div></td></tr>`).join("")}
    <tr><td colspan="2"><b>합계</b></td><td class="n"><b>${fmt(r.fee_total)}</b></td><td class="n"><b>${fmt(r.gift_total)}</b></td><td class="n ${cls(r.profit)}"><b>${sgn(r.profit)}</b></td><td></td></tr></tbody></table>`;
}
function renderSheet() {
  const root = $("#sheet-root"); const l = S.lines.find(x => x.id === S.sheet.id);
  if (!l) { closeSheet(); return; }
  const r = l._r, sn = l.snap, st = S.sheet;
  const conds = sn.conditions || [];
  const keepScroll = root.querySelector(".sheet")?.scrollTop || 0;
  root.innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(l.name)} 상세">
    <div class="sheet-top"><span class="dot" style="background:${colorOf(l.id)}"></span><h2>${esc(l.name)}</h2><button class="btn sm x" id="sh-x">닫기</button></div>
    <div class="panel" style="display:grid;gap:8px">
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip acc">${esc(sn.carrierName)}</span><span class="chip">${esc(sn.plan.name)}</span><span class="chip">월 ${fmt(sn.plan.fee)}원</span>${sn.code ? `<span class="chip">코드 ${esc(sn.code)}</span>` : ""}${(sn.cautions || []).map(c => `<span class="chip warn">${esc(c)}</span>`).join("")}</div>
      <div class="summary-strip"><div><div class="k">개통 → 해지</div><div class="v" style="font-size:.9rem">${md(l.join)} → ${md(r.cancel)}</div></div><div><div class="k">순이익 (${r.hold}개월)</div><div class="v ${cls(r.profit)}">${sgn(r.profit)}</div></div>
        <div><div class="k">받음 / 총사은품</div><div class="v" style="font-size:.9rem">${fmt(r.received)} / ${fmt(r.gift_total)}</div></div><div><div class="k">해지까지</div><div class="v">${r.cancel >= TODAY ? "D-" + dayDiff(TODAY, r.cancel) : "해지됨"}</div></div></div>
      ${sn.url ? `<div style="font-size:.8rem"><a href="${esc(sn.url)}" target="_blank" rel="noopener">${esc(sn.title)}</a> <span class="mut">· 스냅샷 ${esc((sn.snapAt || "").slice(0, 10))}</span></div>` : ""}
      ${l.memo ? `<div style="font-size:.84rem">${esc(l.memo)}</div>` : ""}
    </div>
    ${conds.length || (l.todos || []).length ? `<div class="panel"><h2>체크리스트 <span class="aside">사은품 받으려면</span></h2><div class="gl">
      ${conds.map((c, i) => `<label class="${(l.checks || {})[i] ? "done" : ""}"><input type="checkbox" class="chk" data-act="cond" data-line="${esc(l.id)}" data-key="${i}" ${(l.checks || {})[i] ? "checked" : ""} ${S.readOnly ? "disabled" : ""}><span>${esc(c)}</span></label>`).join("")}
      ${(l.todos || []).map((t, i) => `<label class="${t.done ? "done" : ""}"><input type="checkbox" class="chk" data-act="todo" data-line="${esc(l.id)}" data-key="${i}" ${t.done ? "checked" : ""} ${S.readOnly ? "disabled" : ""}><span>${t.date ? `<span class="num mut">${md(t.date)}</span> ` : ""}${esc(t.text)}</span></label>`).join("")}
    </div></div>` : ""}
    ${(sn.warnings || []).length > 1 || (sn.payNotes || []).length ? `<details class="panel"><summary style="cursor:pointer;font-weight:600">이벤트 유의사항 · 지급일 안내</summary>
      ${(sn.warnings || []).length ? `<ul class="notes" style="padding:0;margin:10px 0 0">${sn.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
      ${(sn.payNotes || []).length ? `<ul class="notes" style="padding:0;margin:10px 0 0">${sn.payNotes.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}</details>` : ""}
    <div class="panel"><h2>월별 내역 <span class="aside">체크 = 수령 확인</span></h2><div class="scroll">${monthTable(r, l)}</div></div>
    <div class="panel"><h2>설정</h2>${st.edit ? editForm(l) : `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sh-edit" ${S.readOnly ? "disabled" : ""}>회선 정보 수정</button>
      ${st.del ? `<span class="confirm">정말 삭제할까? 되돌릴 수 없어. <button class="btn sm danger" id="sh-del-y">삭제</button><button class="btn sm" id="sh-del-n">취소</button></span>` : `<button class="btn danger" id="sh-del" ${S.readOnly ? "disabled" : ""}>회선 삭제</button>`}</div>`}</div>
  </div></div>`;
  root.querySelector(".sheet").scrollTop = keepScroll;
  $("#sh-x").onclick = closeSheet;
  $("#sheet-bg").onclick = e => { if (e.target.id === "sheet-bg") closeSheet(); };
  const ed = $("#sh-edit"); if (ed) ed.onclick = () => { st.edit = true; renderSheet(); };
  const d = $("#sh-del"); if (d) d.onclick = () => { st.del = true; renderSheet(); };
  const dn = $("#sh-del-n"); if (dn) dn.onclick = () => { st.del = false; renderSheet(); };
  const dy = $("#sh-del-y"); if (dy) dy.onclick = async () => { try { await S.db.doc("lines/" + l.id).delete(); toast("회선 삭제함"); closeSheet(); } catch (e) { toast("삭제 실패"); } };
  if (st.edit) bindEdit(l);
}
function editForm(l) {
  const labels = [...new Set(l.snap.plan.m.flatMap(m => m[1].map(g => g[0])).concat((l.snap.plan.ig || []).map(g => g.label)))];
  return `<div class="form-row"><label class="field"><span>이름</span><input class="in" id="e-name" value="${esc(l.name)}"></label>
      <label class="field"><span>개통일</span><input class="in" type="date" id="e-join" value="${l.join}"></label>
      <label class="field"><span>유지 개월</span><input class="in" type="number" min="1" id="e-hold" value="${l.hold || ""}" placeholder="${l._r.hold}"></label>
      <label class="field"><span>또는 해지일</span><input class="in" type="date" id="e-cancel" value="${l.cancel || ""}"></label></div>
    <label class="field" style="margin-top:10px"><span>메모</span><textarea class="in" id="e-memo" rows="2">${esc(l.memo || "")}</textarea></label>
    <div style="margin-top:10px;font-size:.78rem;color:var(--muted)">받는 사은품</div>
    <div class="gl">${labels.map(x => `<label><input type="checkbox" class="chk" data-eexcl="${esc(x)}" ${isExcluded(l, x) ? "" : "checked"}><span>${esc(x)}</span></label>`).join("")}</div>
    <div style="margin-top:10px;font-size:.78rem;color:var(--muted)">할 일 추가</div>
    <div class="form-row"><label class="field"><span>날짜</span><input class="in" type="date" id="e-tdate"></label><label class="field"><span>내용</span><input class="in" id="e-ttext" placeholder="예: 알림톡 받고 사은품 선택"></label></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="e-save">저장</button><button class="btn" id="e-cancel-btn">취소</button></div>`;
}
function bindEdit(l) {
  $("#e-cancel-btn").onclick = () => { S.sheet.edit = false; renderSheet(); };
  $("#e-save").onclick = async () => {
    const patch = { name: $("#e-name").value.trim() || l.name, join: $("#e-join").value || l.join, memo: $("#e-memo").value };
    const c = $("#e-cancel").value, h = +$("#e-hold").value;
    if (c) { patch.cancel = c; patch.hold = null; } else if (h) { patch.hold = h; patch.cancel = null; }
    patch.excl = [...document.querySelectorAll("[data-eexcl]")].filter(b => !b.checked).map(b => b.dataset.eexcl);
    const td = $("#e-tdate").value, tt = $("#e-ttext").value.trim();
    if (tt) patch.todos = [...(l.todos || []), { date: td || null, text: tt, done: false }];
    S.sheet.edit = false; await saveLine(l.id, patch, "저장함");
  };
}

/* ============================== 데이터 연결 ============================== */
function recompute() { S.lines.forEach(l => { try { l._r = compute(l, cashOnly()); } catch (e) { l._r = { rows: [], cancel: l.join, hold: 0, fee_total: 0, gift_total: 0, profit: 0, monthly: 0, received: 0, overdue: 0, paid: 0 }; } }); }
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view === "home") { drawTimeline(); drawFlow(); } }, 150); });

async function boot() {
  go(VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home");
  if (!window.claude?.use) { S.loadNote = "이 앱은 Claude에서 열어야 저장된 회선을 불러와."; render(); return; }
  const timer = setTimeout(() => { if (!S.ready) { S.loadNote = "저장소 응답이 늦어. 네트워크를 확인해 줘."; render(); } }, 10000);
  const db = await claude.use("db");
  if (!db) { clearTimeout(timer); S.loadNote = "이 화면에서는 저장소를 쓸 수 없어. Claude에 로그인한 상태로 열어 줘."; render(); return; }
  S.db = db;
  claude.use("user").then(async u => { if (u) { const ok = await u.can("data.write"); if (ok === false) { S.readOnly = true; render(); } } });
  let gotLines = false, gotIndex = false;
  const done = () => { if (gotLines && gotIndex && !S.ready) { S.ready = true; clearTimeout(timer); } render(); };
  db.collection("lines").onSnapshot(snap => {
    S.lines = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.snap && l.join).sort((a, b) => (a.created || a.join).localeCompare(b.created || b.join));
    if (!snap.metadata.fromCache || snap.size) gotLines = true; done();
  }, e => { clearTimeout(timer); S.loadNote = "회선을 불러오지 못했어 (" + e.code + ")"; render(); });
  db.doc("meta/index").onSnapshot(snap => { S.index = snap.exists ? snap.data() : { events: [] }; gotIndex = true; done(); },
    () => { gotIndex = true; done(); });
  db.collection("requests").onSnapshot(snap => { S.requests = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); }, () => {});
}
boot();
</script>
